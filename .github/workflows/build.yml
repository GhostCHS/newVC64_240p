name: Build vc64_240p

on:
  push:
    branches: [ main, embedded-key-english ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography pyinstaller

      - name: Download gzinject
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri 'https://api.github.com/repos/krimtonz/gzinject/releases/latest'
          $asset = $release.assets | Where-Object { $_.name -match 'win.*64|windows' -and $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1 }
          if (-not $asset) { throw 'Could not find a Windows gzinject release asset.' }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile gzinject.zip
          Expand-Archive gzinject.zip -DestinationPath gzinject_extract -Force
          $exe = Get-ChildItem gzinject_extract -Recurse -Filter gzinject.exe | Select-Object -First 1
          if (-not $exe) { throw 'gzinject.exe was not found in the downloaded archive.' }
          Copy-Item $exe.FullName .\gzinject.exe -Force

      - name: Patch GUI for automatic key and English-only mode
        shell: pwsh
        run: |
          $p = 'src\vc64_240p_gui.py'
          $s = Get-Content -Raw $p
          $nl = [Environment]::NewLine
          $s = $s.Replace('import vc64tool as T', 'import vc64tool as T' + $nl + 'import key_runtime as K')
          $s = $s.Replace("self.lang = 'pt'", "self.lang = 'en'")
          $s = $s.Replace("self.langbtn.pack(side='right')", "self.langbtn.pack(side='right')" + $nl + "        self.langbtn.pack_forget()")
          $s = $s.Replace("self.keyvar = tk.StringVar(value=os.path.join(app_dir(), 'common-key.bin'))", "self.keyvar = tk.StringVar(value=K.common_key_path())")
          $s = $s.Replace("        self.keybtn.pack(side='left')", "        self.keybtn.pack(side='left')" + $nl + "        k.pack_forget()")
          $s = $s.Replace("            key = self.keyvar.get()", "            key = K.common_key_path()")
          $s = $s.Replace("            key = T.load_key(self.keyvar.get())", "            key = T.load_key(K.common_key_path())")
          Set-Content -Path $p -Value $s -Encoding utf8 -NoNewline

      - name: Build EXE
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --onefile --noconsole --clean --name vc64_240p --add-binary "%CD%\gzinject.exe;." --distpath dist --workpath build\_work --specpath build src\vc64_240p_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: vc64_240p-windows
          path: dist/vc64_240p.exe
          if-no-files-found: error
